name: Build Acode Release APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build and Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Install Project Dependencies
        run: |
          npm install
          npm run setup

      - name: Build Production Release APK
        run: |
          node utils/storage_manager.mjs y
          npm run build paid prod apk

      - name: Sign Release APK
        run: |
          mkdir -p dist-apks
          keytool -genkeypair -v -keystore release.keystore -alias acode -keyalg RSA -keysize 2048 -validity 10000 -storepass acodepass -keypass acodepass -dname "CN=Acode, OU=Acode, O=Acode, L=City, S=State, C=US"
          
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"
          
          UNSIGNED_APK=$(find platforms/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find platforms/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          
          echo "Found APK to sign: $UNSIGNED_APK"
          
          if [ -n "$UNSIGNED_APK" ]; then
            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" dist-apks/aligned.apk || cp "$UNSIGNED_APK" dist-apks/aligned.apk
            $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:acodepass --key-pass pass:acodepass --out dist-apks/Acode-Ubuntu24-Release.apk dist-apks/aligned.apk
            rm -f dist-apks/aligned.apk
            sha256sum dist-apks/Acode-Ubuntu24-Release.apk > dist-apks/Acode-Ubuntu24-Release.apk.sha256
          fi

      - name: Publish Direct Release on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-release
          name: "Acode Ubuntu 24.04 Release APK"
          body: |
            ## Acode with Ubuntu 24.04 LTS (Noble)
            
            ### Features:
            - **Ubuntu 24.04 LTS (Noble Numbat)**: Pure glibc environment via PRoot with seamless hardlink extraction support.
            - **In-App GitHub Integration**: Open and browse GitHub inside Acode with session logins, close button, and file downloads.
            - **Downloads Manager**: Dedicated sidebar section to browse, open, install APKs, and manage downloaded files.
            - **Python & Binary Wheels**: Full support for Python 3, pip, and precompiled C/C++ packages.
            - **Android Group Warnings Resolved**: Fixed UID/GID mappings in /etc/group.
            - **Acode CLI**: Open files and directories directly in editor using `acode <path>`.
            
            ### Download:
            Directly download the single-file **Acode-Ubuntu24-Release.apk** below.
          files: dist-apks/Acode-Ubuntu24-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Acode-Ubuntu24-Release-APK
          path: dist-apks/*
          retention-days: 30
